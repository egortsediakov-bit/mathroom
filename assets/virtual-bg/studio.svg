  <rect x="34" y="679" width="240" height="6" rx="3" fill="#D5B89D" fill-opacity=".50"/>
  <g opacity=".93">
    <rect x="49" y="133" width="33" height="117" rx="4" fill="#B86042"/><rect x="88" y="151" width="30" height="99" rx="4" fill="#536A61"/>
    <rect x="124" y="118" width="28" height="132" rx="4" fill="#D79C50"/><rect x="158" y="144" width="42" height="106" rx="4" fill="#7A5344"/>

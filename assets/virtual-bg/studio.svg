  <rect x="65" y="525" width="166" height="112" rx="9" fill="#F5EBDD" fill-opacity=".86"/>
  <rect x="78" y="539" width="140" height="86" rx="5" fill="#DCC3A7"/>
  <circle cx="148" cy="582" r="27" fill="#ED591A" fill-opacity=".52"/>
</g>

<!-- soft framed art on far right -->
<g opacity=".86" filter="url(#shadow)">
  <rect x="1214" y="112" width="242" height="302" rx="16" fill="#F7EFE4"/>
  <rect x="1232" y="130" width="206" height="266" rx="8" fill="#D6C3AE"/>

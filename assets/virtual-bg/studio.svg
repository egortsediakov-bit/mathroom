<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#CDB9A4"/><stop offset=".38" stop-color="#E8DDD0"/><stop offset=".72" stop-color="#EDE3D7"/><stop offset="1" stop-color="#B99C7E"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9A765B"/><stop offset="1" stop-color="#6F513E"/></linearGradient>
  <radialGradient id="day" cx="72%" cy="24%" r="55%"><stop stop-color="#FFF8EA" stop-opacity=".96"/><stop offset=".42" stop-color="#FFF3DD" stop-opacity=".46"/><stop offset="1" stop-color="#FFF0D6" stop-opacity="0"/></radialGradient>
  <radialGradient id="safe" cx="50%" cy="46%" r="44%"><stop stop-color="#F5ECE1" stop-opacity=".56"/><stop offset="1" stop-color="#F5ECE1" stop-opacity="0"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#402817" flood-opacity=".18"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#wall)"/>
<rect y="728" width="1600" height="172" fill="url(#floor)"/>
<path d="M0 720H1600" stroke="#7D5D47" stroke-opacity=".28" stroke-width="7"/>
<rect width="1600" height="900" fill="url(#day)"/>
<rect width="1600" height="900" fill="url(#safe)"/>


  <script>
    window.__MATHROOM_BUILD__='58.1-auto-complete';
    (() => {
      /* GitHub Pages and Chromium forks may keep index.html longer than the
         versioned JS files. A tiny no-store build probe makes the shell
         self-healing without flushing cached ML/WASM assets. */
      fetch('./build.json?t='+Date.now(),{cache:'no-store'})
        .then(r=>r.ok?r.json():null)
        .then(info=>{
          const latest=String(info?.build||'');
          if(!latest||latest===window.__MATHROOM_BUILD__)return;
          const url=new URL(location.href);
          if(url.searchParams.get('_mrbuild')===latest)return;
          url.searchParams.set('_mrbuild',latest);
          location.replace(url.toString());
        })
        .catch(()=>{});
    })();
  </script>
  <script>
    (() => {
      /* Apply saved theme before CSS paints to avoid a light flash on dark mode. */
      let theme='light';
      try{theme=localStorage.getItem('mathroom.theme')==='dark'?'dark':'light'}catch{}
      document.documentElement.dataset.theme=theme;
      document.documentElement.style.colorScheme=theme;
    })();
  </script>

  <!-- Virtual background assets start downloading with the page. Yandex gets
       the non-SIMD MediaPipe runtime because its Chromium fork can select the
       SIMD build but then stall inside the legacy SolutionWasm runtime. -->
  <link rel="preconnect" crossorigin="anonymous" href="https://cdn.jsdelivr.net" />
  <link rel="preload" as="script" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation.js" />
  <link rel="preload" as="fetch" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation_landscape.tflite" />
  <script>
    (() => {
      const base='https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/';
      const ya=/YaBrowser/i.test(navigator.userAgent||'');
      const stem=ya?'selfie_segmentation_solution_wasm_bin':'selfie_segmentation_solution_simd_wasm_bin';
      [
        [stem+'.js','script',''],
        [stem+'.wasm','fetch','application/wasm']
      ].forEach(([href,as,type])=>{
        const link=document.createElement('link');
        link.rel='preload';
        link.as=as;
        link.crossOrigin='anonymous';
        link.href=base+href;
        if(type)link.type=type;
        document.head.appendChild(link);
      });
    })();
  </script>

  <div id="app"><div class="center-page"><div class="auth-card"><div class="brand">Mathroom</div><h1>Загрузка…</h1><p class="muted">Запускаем кабинет.</p></div></div></div><div id="toast" class="toast"></div>
  <script>
    (()=>{
      const build=window.__MATHROOM_BUILD__||'58.1-auto-complete';
      let lastError='',resourceError='';
      const clean=v=>String(v||'').replace(/https?:\/\/[^\s]+/g,'[url]').slice(0,500);
      const escBoot=v=>String(v||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
      const retryKey='mathroom.boot.retry.'+build;
      const retryOnce=()=>{
        try{
          if(sessionStorage.getItem(retryKey))return false;
          sessionStorage.setItem(retryKey,String(Date.now()));
          const u=new URL(location.href);
          u.searchParams.set('_mr_boot_retry',String(Date.now()));
          setTimeout(()=>location.replace(u.toString()),500);
          return true;
        }catch{return false}
      };
      window.addEventListener('error',e=>{lastError=clean(e?.message||'Ошибка JavaScript')});
      window.addEventListener('unhandledrejection',e=>{lastError=clean(e?.reason?.message||e?.reason||'Необработанная ошибка')});
      document.addEventListener('error',e=>{
        const t=e.target;
        if(!t||!(t.tagName==='SCRIPT'||t.tagName==='LINK'))return;
        const raw=t.src||t.href||'';
        if(!raw)return;
        try{
          const u=new URL(raw,location.href);
          if(u.origin!==location.origin)return;
          resourceError='Не загрузился файл: '+u.pathname.split('/').pop();
          retryOnce();
        }catch{}
      },true);
      setTimeout(()=>{
        const el=document.getElementById('app');if(!el)return;
        const loading=el.textContent?.includes('Загрузка…');
        if(!loading){try{sessionStorage.removeItem(retryKey)}catch{};return}
        if(!lastError&&!resourceError&&retryOnce())return;
        const detail=resourceError||lastError;
        el.innerHTML=`<div class="center-page"><div class="auth-card config-card"><div class="brand">Mathroom</div><h1>Не удалось запустить интерфейс</h1><p>Страница загрузилась, но один из файлов приложения не запустился.</p>${detail?`<div class="config-code">${escBoot(detail)}</div>`:''}<p class="small muted">Автовосстановление уже выполнено. Если карточка осталась — пришли скриншот с текстом ошибки.</p></div></div>`;
      },5000);
    })();
  </script>
